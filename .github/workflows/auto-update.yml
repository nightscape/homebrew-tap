name: Auto-update formulae/casks
on:
  workflow_dispatch: # Allow manual triggers
  schedule:
    - cron: '0 */12 * * *' # Run twice daily
  release:
    types: [published]

concurrency:
  group: auto-update
  cancel-in-progress: true

jobs:
  cleanup-stale-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale bump branches without open PRs
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          set -euo pipefail

          open_pr_branches=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref')

          gh api "repos/${{ github.repository }}/branches" --paginate \
            --jq '.[].name | select(startswith("bump-"))' \
          | while IFS= read -r branch; do
            if echo "$open_pr_branches" | grep -qxF "$branch"; then
              echo "Keeping branch: $branch (has open PR)"
            else
              echo "Deleting stale branch: $branch (no open PR)"
              gh api -X DELETE \
                "repos/${{ github.repository }}/git/refs/heads/$branch" || true
            fi
          done

  update-formulae:
    needs: cleanup-stale-branches
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust tap
        run: brew trust ${{ github.repository }}

      - name: Update formulae
        uses: dawidd6/action-homebrew-bump-formula@a0e064e08103c01870c6d1b05168d1b726aab119 # v8
        with:
          token: ${{ secrets.TOKEN }}
          tap: ${{ github.repository }}
          livecheck: true
          user_name: "Martin Mauch"
          user_email: "martin.mauch@gmail.com"
          force: false

  update-casks:
    needs: cleanup-stale-branches
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust tap
        run: brew trust ${{ github.repository }}

      - name: Update casks
        uses: eugenesvk/action-homebrew-bump-cask@6b066272df85c164f0496877387ecc8d989a194f # 3.8.6
        with:
          token: ${{ secrets.TOKEN }}
          tap: ${{ github.repository }}
          livecheck: true
          force: false
